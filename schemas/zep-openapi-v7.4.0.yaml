          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Employees
      description: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - firstname
                - lastname
                - email
                - password
                - price_group
              properties:
                username:
                  type: string
                  description: Unique username (5–255 characters)
                firstname:
                  type: string
                  description: First name
                lastname:
                  type: string
                  description: Last name
                email:
                  type: string
                  format: email
                  description: Unique email address
                password:
                  type: string
                  format: password
                  description: Password (min. 8 characters, max. 48)
                personal_number:
                  type: string
                  nullable: true
                  description: Personal number (optional, unique)
                birthdate:
                  type: string
                  format: date
                  nullable: true
                  description: Birth date
                phone:
                  type: string
                  nullable: true
                  description: Work phone number
                department_id:
                  type: integer
                  nullable: true
                  description: Department ID
                rights:
                  type: string
                  nullable: true
                  enum: [ 0, 1, 2, 3, 4 ] # 0 = User, 1 = Admin, 2 = Controller, 3 = User with additional authorizations, 4 = Project Controller
                  description: Access rights
                employment:
                  type: string
                  nullable: true
                  enum: [ 0, 1, 2 ] # 0 = Employee, 1 = Freelancer, 2 = Freelancer with credit note
                  description: Type of employment
                price_group:
                  type: string
                  description: Name of the price group
                oauthUsername:
                  type: string
                  nullable: true
                  description: OAuth username (must be unique)
                street:
                  type: string
                  nullable: true
                zip:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                abbreviation:
                  type: string
                  nullable: true
                salutation:
                  type: string
                  nullable: true
                title:
                  type: string
                  nullable: true
                mobile:
                  type: string
                  nullable: true
                fax:
                  type: string
                  nullable: true
                private_phone:
                  type: string
                  nullable: true
                iban:
                  type: string
                  nullable: true
                bic:
                  type: string
                  nullable: true
                account_no:
                  type: string
                  nullable: true
                bank_name:
                  type: string
                  nullable: true
                bank_code:
                  type: string
                  nullable: true
                currency:
                  type: string
                  nullable: true
                approval_date:
                  type: string
                  format: date
                  nullable: true
                vat:
                  type: string
                  nullable: true
                personio_id:
                  type: string
                  nullable: true
                cost_bearer:
                  type: string
                  nullable: true
                tax_id:
                  type: string
                  nullable: true
                creditor_number:
                  type: string
                  nullable: true
                categories:
                  type: array
                  items:
                    type: string
                  nullable: true
                dynamicAttributes:
                  type: array
                  items:
                    type: object
                  nullable: true
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid input
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Duplicate field value (e.g. username, email)
