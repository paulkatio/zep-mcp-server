  /attendances:
    get:
      tags:
        - Attendances
      description: Get all attendances
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendancesListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Attendances
      description: Create a new attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
                - date
                - from
                - to
                - project_task_id
                - project_id
                - activity_id
              properties:
                employee_id:
                  type: string
                  description: The username of the employee creating the project time entry.
                date:
                  type: string
                  format: date
                  description: The date of the project time entry.
                from:
                  type: string
                  format: time
                  description: Start time of the project time entry (format H:i:s).
                to:
                  type: string
                  format: time
                  description: End time of the project time entry (format H:i:s). Must be after `from`.
                project_task_id:
                  type: integer
                  description: The ID of the related project task.
                project_id:
                  type: integer
                  description: The ID of the related project.
                activity_id:
                  type: string
                  description: The ID of the associated activity.
                duration:
                  type: number
                  format: float
                  description: Total duration of the project time in hours.
                locked:
                  type: boolean
                  description: Indicates whether the project time entry is locked.
                is_travel:
                  type: boolean
                  description: Indicates whether this time entry counts as travel time.
                billable:
                  type: boolean
                  description: Indicates whether the time entry is billable.
                work_location_is_project_relevant:
                  type: boolean
                  description: Indicates whether the work location is project-related.
                color:
                  type: string
                  pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
                  description: Hex color value (e.g. #FF5733).
                start:
                  type: string
                  description: Starting point of the trip.
                destination:
                  type: string
                  description: Destination of the trip.
                vehicle_id:
                  type: integer
                  description: The ID of the vehicle used.
                private:
                  type: boolean
                  description: Indicates whether the trip was private.
                km:
                  type: integer
                  description: Distance traveled in kilometers.
                passengers:
                  type: integer
                  description: Number of passengers.
                direction_of_travel:
                  type: string
                  enum: [ outbound, return, continue ]
                  description: Direction of travel (e.g. continue).
      responses:
        '201':
          description: Attendance created successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid input
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /employees:
    get:
      tags:
