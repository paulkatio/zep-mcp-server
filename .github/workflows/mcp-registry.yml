name: Publish to MCP Registry

# Manual trigger only — run after the npm package for this version is published.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC for mcp-publisher authentication

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # mcp-publisher is the official MCP Registry CLI. The exact install/commands
      # evolve — verify against https://github.com/modelcontextprotocol/registry.
      - name: Install mcp-publisher
        run: go install github.com/modelcontextprotocol/registry/cmd/mcp-publisher@latest

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: mcp-publisher publish
